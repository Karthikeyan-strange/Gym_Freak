# ===================================================================
# Supabase PostgreSQL Configuration Profile
# Run with: --spring.profiles.active=supabase
# ===================================================================
# Replace [YOUR-PASSWORD] and [YOUR-PROJECT-REF] with your Supabase credentials
spring.datasource.url=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.[YOUR-PROJECT-REF]
spring.datasource.password=[YOUR-PASSWORD]
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
